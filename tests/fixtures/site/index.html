<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laboratorio multivista</title>
    <style>
      body { max-width: 820px; margin: 0 auto; padding: 24px; font: 16px/1.6 system-ui; }
      nav { position: sticky; top: 0; padding: 12px; background: #14213a; color: white; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border: 1px solid #94a3b8; padding: 8px; }
      pre { overflow: auto; padding: 16px; background: #e2e8f0; }
      .nested { height: 180px; overflow: auto; border: 2px solid #64748b; padding: 12px; }
      .spacer { height: 900px; background: linear-gradient(#fff, #dbeafe); }
      canvas { border: 1px solid #64748b; }
    </style>
  </head>
  <body>
    <nav>No debe formar parte del contenido legible</nav>
    <main>
      <h1>Estado de SPA: <span id="state">A</span></h1>
      <p>Los botones cambian el estado sin cambiar la URL.</p>
      <button id="state-a">Estado A</button>
      <button id="state-b">Estado B</button>
      <article id="dynamic"><h2>Contenido A</h2><p>Primera vista del mismo recurso.</p></article>
      <h2>Tabla y código</h2>
      <table><thead><tr><th>Campo</th><th>Valor</th></tr></thead><tbody><tr><td>Modo</td><td>Prueba</td></tr></tbody></table>
      <pre><code>const sameUrl = true;</code></pre>
      <form>
        <label>Nombre <input value="Ada" /></label>
        <label>Clave <input type="password" value="no-exportar" /></label>
        <label>Rol <select><option selected>Investigadora</option></select></label>
      </form>
      <div class="nested"><p>Scroll anidado</p><div class="spacer"></div><p>Final anidado</p></div>
      <div class="spacer"></div>
      <img id="lazy" loading="lazy" alt="Imagen con carga diferida" width="200" height="100" />
      <img src="/imagen-que-no-existe.png" alt="Imagen fallida con texto alternativo" />
      <iframe title="Marco de otro origen" src="https://example.com"></iframe>
      <canvas id="drawing" width="240" height="90" aria-label="Gráfico de prueba"></canvas>
    </main>
    <script>
      const state = document.querySelector('#state');
      const dynamic = document.querySelector('#dynamic');
      document.querySelector('#state-a').addEventListener('click', () => {
        state.textContent = 'A';
        dynamic.innerHTML = '<h2>Contenido A</h2><p>Primera vista del mismo recurso.</p>';
      });
      document.querySelector('#state-b').addEventListener('click', () => {
        state.textContent = 'B';
        dynamic.innerHTML = '<h2>Contenido B</h2><p>Segunda vista, URL idéntica.</p>';
      });
      const canvas = document.querySelector('#drawing');
      const context = canvas.getContext('2d');
      context.fillStyle = '#2155d9';
      context.fillRect(10, 10, 220, 70);
      context.fillStyle = 'white';
      context.font = '18px sans-serif';
      context.fillText('Canvas', 88, 53);
      const observer = new IntersectionObserver((entries) => {
        if (entries.some((entry) => entry.isIntersecting)) {
          document.querySelector('#lazy').src =
            'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100"><rect width="200" height="100" fill="%232155d9"/><text x="35" y="58" fill="white" font-size="18">Lazy load</text></svg>');
          observer.disconnect();
        }
      });
      observer.observe(document.querySelector('#lazy'));
    </script>
  </body>
</html>
